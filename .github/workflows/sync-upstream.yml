name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream, preserve fork workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          UPSTREAM=$(gh repo view "$GITHUB_REPOSITORY" --json parent \
            -q '.parent.owner.login + "/" + .parent.name')
          git fetch "https://github.com/${UPSTREAM}.git" main
          upstream_commit=$(git rev-parse FETCH_HEAD)

          backup=$(mktemp -d "${RUNNER_TEMP}/equicord-workflows.XXXXXX")
          trap 'rm -rf "$backup"' EXIT
          cp -a .github/workflows/. "$backup/"

          if git merge --no-commit --no-ff "$upstream_commit"; then
            merge_status=0
          else
            merge_status=$?
          fi

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "$backup/." .github/workflows/
          git add -A -- .github/workflows

          conflicts=$(git diff --name-only --diff-filter=U)
          if [[ -n "$conflicts" ]]; then
            printf 'Unresolved conflicts outside workflows:\n%s\n' "$conflicts"
            git merge --abort
            exit 1
          fi

          if [[ "$merge_status" -ne 0 ]] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            printf 'Merge failed without a recoverable merge state.\n'
            exit "$merge_status"
          fi

          git diff --cached --exit-code -- .github/workflows

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Sync with upstream (fork workflows preserved)"
          elif ! git diff --cached --quiet; then
            git commit -m "Preserve fork workflow files"
          fi

          git push origin HEAD:main
